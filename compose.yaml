# Start auf dem Spark:  docker compose up -d --build
# Einstellungen in der Datei .env neben dieser Datei, z.B.:
#   LIT_INVITE_CODE=<selbst ausgedachter Code>
#   LIT_HOST_PORT=8091        (falls 8080 auf dem Spark schon belegt ist)
# Konto anlegen:        docker compose exec lit node server/cli.js user:add <login>
# Sicherung:            docker compose exec lit node server/cli.js backup /data/backup.db
services:
  lit:
    build: .
    restart: unless-stopped
    environment:
      LIT_INVITE_CODE: ${LIT_INVITE_CODE:-}
    volumes:
      - lit-data:/data
    # Nur lokal erreichbar; nach außen geht es ausschließlich über Tailscale.
    ports:
      - "127.0.0.1:${LIT_HOST_PORT:-8080}:8080"

volumes:
  lit-data:
